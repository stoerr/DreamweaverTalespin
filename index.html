<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Storyteller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Storyteller</h1>
            <p class="subtitle">Let AI craft your stories</p>
        </header>

        <main>
            <section class="input-section">
                <div class="form-group">
                    <label for="api-key">OpenAI API Key:</label>
                    <input type="password" id="api-key" placeholder="sk-..." />
                    <small>Your API key is stored locally and never sent to our servers</small>
                </div>

                <div class="form-group">
                    <label for="story-prompt">Story Prompt:</label>
                    <textarea id="story-prompt" rows="4" placeholder="Enter your story idea (e.g., 'A brave knight on a quest to save a dragon from a princess')"></textarea>
                </div>

                <div class="form-group">
                    <label for="story-length">Story Length:</label>
                    <select id="story-length">
                        <option value="short">Short (1-2 paragraphs)</option>
                        <option value="medium" selected>Medium (3-5 paragraphs)</option>
                        <option value="long">Long (6-10 paragraphs)</option>
                    </select>
                </div>

                <button id="generate-btn" class="btn-primary">Generate Story</button>
            </section>

            <section class="output-section">
                <h2>Your Story</h2>
                <div id="story-output" class="story-container">
                    <p class="placeholder">Your generated story will appear here...</p>
                </div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Crafting your story...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Powered by OpenAI</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
