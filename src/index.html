<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Storyteller</title>
  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container py-4">
    <header class="mb-4 text-center">
      <h1 class="display-5">AI Storyteller</h1>
      <p class="lead">Create story outlines, generate chapters, and listen while the next chapter is prepared.</p>
    </header>

    <main>
      <div class="row">
        <div class="col-md-5">
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Configuration</h5>

              <div class="mb-3">
                <label for="api-key" class="form-label">OpenAI API Key</label>
                <input id="api-key" type="password" class="form-control" placeholder="sk-..." />
                <div class="form-text">Stored locally at <code>chatgpt_api_key</code>.</div>
              </div>

              <div class="mb-3">
                <label for="outline-system-prompt" class="form-label">System prompt (outline)</label>
                <textarea id="outline-system-prompt" class="form-control" rows="2">You are an assistant that returns a numbered outline of chapters for a story. Return each chapter on its own line like "1. Chapter Title - short description".</textarea>
              </div>

              <div class="mb-3">
                <label for="chapter-system-prompt" class="form-label">System prompt (chapter)</label>
                <textarea id="chapter-system-prompt" class="form-control" rows="2">You are an assistant that expands a chapter description into a full chapter. Keep it vivid and engaging.</textarea>
              </div>

              <div class="mb-3">
                <label for="story-prompt" class="form-label">Story prompt</label>
                <textarea id="story-prompt" class="form-control" rows="3" placeholder="Enter the story idea (e.g., 'A curious child discovers a hidden city')"></textarea>
              </div>

              <div class="d-grid gap-2">
                <button id="generate-outline" class="btn btn-primary">Generate Outline</button>
              </div>

            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Playback</h5>
              <div class="mb-2">
                <button id="play-btn" class="btn btn-success">Play</button>
                <button id="pause-btn" class="btn btn-secondary">Pause</button>
                <button id="stop-btn" class="btn btn-danger">Stop</button>
              </div>
              <div>
                <label for="voice-select" class="form-label">Voice</label>
                <select id="voice-select" class="form-select"></select>
              </div>
            </div>
          </div>

        </div>

        <div class="col-md-7">
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Outline</h5>
              <div id="outline-list" class="list-group">
                <div class="list-group-item placeholder">No outline yet. Generate one to start.</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Chapter</h5>
              <div id="chapter-container" class="story-container">Select a chapter to generate or play.</div>
              <div class="mt-3 d-flex gap-2">
                <button id="generate-chapter" class="btn btn-outline-primary">Generate Selected Chapter</button>
                <button id="generate-next-bg" class="btn btn-outline-secondary">Generate Next in Background</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <footer class="mt-4 text-center text-muted">Powered by OpenAI &middot; Client-side only</footer>
  </div>

  <script src="/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
